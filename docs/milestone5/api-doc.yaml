openapi: 3.0.0
info:
  title: Civic Services Platform API
  description: |
    REST API for the Civic Services Platform - Pothole Reporting and Resolution System
    
    ## Authentication
    All endpoints (except public locations) require JWT Bearer token in header:
    ```
    Authorization: Bearer <access_token>
    ```
    
    ## User Roles
    - **citizen**: Submit complaints, view own complaints, submit feedback
    - **field_worker**: Accept assignments, update progress, complete repairs
    - **administrator**: Manage complaints, assign workers, view reports, system settings
      - **system_admin**: Global access, manages municipal admins
      - **municipal_admin**: City-scoped access
    
    ## Response Envelope
    All endpoints return standardized response:
    ```json
    {
      "success": true,
      "message": "Human readable message",
      "data": { ... },
      "errors": null
    }
    ```
    
  version: "1.3"
  x-last-updated: "2026-08-21"
  x-total-endpoints: 69
  x-milestone: "Milestone 5 (Final Submission) — final validated API specification"
  contact:
    name: Team MAY2026-Team-005
    url: https://github.com/IITMPivotLabs/MAY2026-Team-005
  license:
    name: MIT

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://civicservices.app/api/v1
    description: Production server

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (1 hour validity)

  responses:
    UnauthorizedError:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: "Missing or invalid token" }
              errors: { type: "object", nullable: true }

    ForbiddenError:
      description: Insufficient permissions for this role
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: "Only admins can access this endpoint" }
              errors: { type: "object", nullable: true }

    ValidationError:
      description: Request body validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: "Validation failed" }
              errors:
                type: object
                example: { email: ["Invalid email format"], password: ["Too weak"] }

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: "Resource not found" }
              errors: { type: "object", nullable: true }

tags:
  - name: Authentication
    description: User registration, login, and profile management (TPS-1, TPS-2)

  - name: Citizen APIs
    description: Complaint submission, tracking, and feedback (TPS-3 through TPS-10, TPS-59)

  - name: Administrator APIs
    description: Complaint management, field worker assignment, user management, dashboard KPIs, system settings, and municipal administrator hierarchy (TPS-33, TPS-80, TPS-78 through TPS-84, TPS-95, TPS-97, TPS-99, TPS-110, TPS-111)

  - name: Field Worker APIs
    description: Assignment management, progress tracking, repair completion (TPS-86 through TPS-90)

  - name: Notifications
    description: Real-time user notifications (TPS-60, TPS-91 through TPS-94)

  - name: Reports
    description: Analytics, reporting, and report export - CSV/Excel/PDF (TPS-85, TPS-96, TPS-98)

  - name: Locations
    description: Public location lookup services (TPS-31)

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: User Registration
      description: |
        Register a new user account
        
        **Related User Stories**: TPS-1
        
        **Role**: Public (no JWT required)
        
        **Validation Rules**:
        - Email must be unique and valid format
        - Password must contain uppercase, lowercase, digit, and special character
        - Phone must be valid Indian phone format (10 digits)
        - First/last names must not be blank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, example: "john_doe" }
                email: { type: string, format: email, example: "john@example.com" }
                password: { type: string, format: password, example: "SecurePass@123" }
                confirm_password: { type: string, format: password }
                first_name: { type: string, example: "John" }
                last_name: { type: string, example: "Doe" }
                phone: { type: string, example: "9876543210" }
                role: { type: string, enum: ["citizen", "field_worker"], example: "citizen" }
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "User registered successfully" }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      username: { type: string }
                      email: { type: string }
                      role: { type: string }
        "400":
          description: Validation failure (duplicate email, weak password, invalid format)
        "409":
          description: Email already registered
        "422":
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: User Login
      description: |
        Login and obtain JWT tokens
        
        **Related User Stories**: TPS-2
        
        **Role**: Public
        
        **Returns**:
        - `access_token`: Valid for 1 hour
        - `refresh_token`: Valid for 30 days
        
        **Note**: Maintenance mode (TPS-99) can block non-admin logins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login successful, tokens returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Login successful" }
                  data:
                    type: object
                    properties:
                      user: { type: object }
                      access_token: { type: string }
                      refresh_token: { type: string }
        "401":
          description: Invalid credentials or inactive account
        "503":
          description: Maintenance mode enabled for non-admins

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get Current User Profile
      description: |
        Retrieve logged-in user details
        
        **Related User Stories**: TPS-2
        
        **Includes**: Role info, admin level, city scope (if applicable)
      security:
        - Bearer: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      username: { type: string }
                      email: { type: string }
                      role: { type: string }
                      admin_level: { type: string, enum: ["system", "municipal"] }
                      city_id: { type: integer, nullable: true }
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh Access Token
      description: |
        Exchange a valid refresh token for a new access token

        **Related User Stories**: TPS-2
      security:
        - Bearer: []
      responses:
        "200":
          description: New access token issued
        "401":
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      description: |
        Log out the current user

        **Related User Stories**: TPS-2
      security:
        - Bearer: []
      responses:
        "200":
          description: Logged out successfully
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change Password
      description: |
        Change the current user's own password

        **Related User Stories**: TPS-2
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
                confirm_password: { type: string, format: password }
      responses:
        "200":
          description: Password changed
        "400":
          description: Current password incorrect
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "422":
          $ref: '#/components/responses/ValidationError'

  /auth/me/avatar:
    post:
      tags: [Authentication]
      summary: Upload Profile Avatar
      description: |
        Upload a profile photo for the current user (multipart/form-data)

        **Related User Stories**: TPS-2
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
      responses:
        "200":
          description: Avatar uploaded, returns updated user with avatar_url
        "400":
          description: Invalid file type or size
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me/avatar/{filename}:
    get:
      tags: [Authentication]
      summary: Serve Avatar Photo
      description: |
        Serve an uploaded avatar photo (public, no JWT required)

        **Related User Stories**: TPS-2
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Avatar image file
        "404":
          $ref: '#/components/responses/NotFoundError'

  /citizen/complaints:
    post:
      tags: [Citizen APIs]
      summary: Submit New Complaint
      description: |
        Citizen submits a new pothole/infrastructure complaint
        
        **Related User Stories**: TPS-3, TPS-4
        
        **Requirements**:
        - Photo/image is MANDATORY (uploaded first, then referenced)
        - Pincode must resolve to exactly one city or city must be explicitly provided
        - Priority defaults to system setting (TPS-99)
        
        **Photo Upload Flow**:
        1. Upload photo using multipart form to get `image_url`
        2. Include `image_url` in complaint body
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, pincode, image_url]
              properties:
                title: { type: string, example: "Large pothole on Main Street" }
                description: { type: string }
                pincode: { type: string, pattern: '^\d{6}$', example: "560001" }
                city_id: { type: integer, nullable: true, description: "Required if pincode resolves to multiple cities" }
                category: { type: string, enum: ["pothole", "streetlight", "drainage", "garbage", "road_damage", "other"] }
                priority: { type: string, enum: ["low", "medium", "high", "urgent"], nullable: true }
                image_url: { type: string, example: "complaints/uuid4-filename.jpg" }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
      responses:
        "201":
          description: Complaint submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string, example: "pending" }
                      created_at: { type: string, format: date-time }
        "400":
          description: Invalid pincode, city mismatch, or missing image
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "422":
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Citizen APIs]
      summary: List My Complaints
      description: |
        Retrieve all complaints submitted by the logged-in citizen
        
        **Related User Stories**: TPS-4, TPS-10
        
        **Pagination**: Returns 20 items per page
        
        **Statuses Shown**: All (including pending, assigned, in_progress, resolved, closed, rejected, cancelled)
      security:
        - Bearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { type: string, enum: ["pending", "assigned", "in_progress", "resolved", "closed", "rejected", "cancelled"] }
        - name: sort_by
          in: query
          schema: { type: string, enum: ["created_at", "updated_at"], default: "created_at" }
      responses:
        "200":
          description: Complaints retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      items: { type: array }
                      pagination:
                        type: object
                        properties:
                          page: { type: integer }
                          per_page: { type: integer }
                          total: { type: integer }
                          pages: { type: integer }
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /citizen/complaints/{id}:
    get:
      tags: [Citizen APIs]
      summary: View Complaint Details
      description: |
        Get full details of a specific complaint
        
        **Related User Stories**: TPS-5
        
        **Includes**: Current status, assigned worker info, feedback (if resolved)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Complaint details retrieved
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          description: Not the complaint owner
        "404":
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Citizen APIs]
      summary: Edit Complaint
      description: |
        Update complaint title/description (ONLY while status is pending)
        
        **Related User Stories**: TPS-5
        
        **Restrictions**:
        - Cannot edit status or priority (admin-only)
        - Cannot edit if status is not "pending"
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Complaint updated
        "400":
          description: Complaint not in pending status
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Citizen APIs]
      summary: Cancel Complaint
      description: |
        Soft-cancel complaint (sets status to "cancelled", preserves record)
        
        **Related User Stories**: TPS-75
        
        **Note**: Cancelled complaints are permanently hidden from assignment, but remain in citizen's history
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Complaint cancelled
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /citizen/complaints/{id}/feedback:
    post:
      tags: [Citizen APIs]
      summary: Submit Complaint Feedback
      description: |
        Submit feedback/satisfaction rating (ONLY after complaint is resolved or closed)
        
        **Related User Stories**: TPS-59
        
        **Restrictions**:
        - Complaint must be in "resolved" or "closed" status
        - Only ONE feedback per complaint (unique constraint)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201":
          description: Feedback submitted
        "400":
          description: Complaint not resolved/closed or feedback already exists
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /citizen/complaints/nearby-duplicates:
    get:
      tags: [Citizen APIs]
      summary: Check Nearby Possible-Duplicate Complaints
      description: |
        Check for still-open reports near a map pin before submitting a new
        complaint. Advisory only — never blocks submission; lets the report
        form warn "a similar report already exists nearby, submit anyway?"
        with a photo of the existing report for comparison.

        **Related User Stories**: None (added beyond baseline) — recovered
        from an earlier feature branch and reintegrated into this branch
        this sprint; no corresponding Jira TPS story.
      security:
        - Bearer: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, format: float }
        - name: longitude
          in: query
          required: true
          schema: { type: number, format: float }
        - name: radius_meters
          in: query
          schema: { type: integer }
          description: Overrides the configured system-wide radius for this lookup only
      responses:
        "200":
          description: Nearby complaints retrieved
        "400":
          description: Missing or invalid latitude/longitude
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /citizen/complaints/media:
    post:
      tags: [Citizen APIs]
      summary: Upload Complaint Photo
      description: |
        Upload a mandatory photo for a pothole complaint (multipart/form-data),
        returns an `image_url` to reference when submitting the complaint

        **Related User Stories**: TPS-3
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
      responses:
        "201":
          description: Photo uploaded, returns image_url
        "400":
          description: Invalid file type or size
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /citizen/complaints/media/{filename}:
    get:
      tags: [Citizen APIs]
      summary: Serve Complaint Photo
      description: |
        Serve an uploaded complaint photo (public, no JWT required)

        **Related User Stories**: TPS-3
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Photo image file
        "404":
          $ref: '#/components/responses/NotFoundError'

  /citizen/dashboard:
    get:
      tags: [Citizen APIs]
      summary: Citizen Dashboard
      description: |
        Get citizen dashboard statistics
        
        **Related User Stories**: TPS-10
        
        **Returns**: Complaint counts by status, recent complaints
      security:
        - Bearer: []
      responses:
        "200":
          description: Dashboard stats retrieved
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /admin/complaints:
    get:
      tags: [Administrator APIs]
      summary: List All Complaints (Admin)
      description: |
        List all complaints with advanced filtering
        
        **Related User Stories**: TPS-78
        
        **Scoping**: Municipal admins see only their city; system admins see all cities
        
        **Filters**: status, priority, category, date_from, date_to, search
      security:
        - Bearer: []
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string, enum: ["low", "medium", "high", "urgent"] }
        - name: date_from
          in: query
          schema: { type: string, format: date, description: "YYYY-MM-DD" }
        - name: date_to
          in: query
          schema: { type: string, format: date, description: "YYYY-MM-DD" }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Complaints retrieved
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "400":
          description: Invalid filter parameters

  /admin/complaints/{id}:
    get:
      tags: [Administrator APIs]
      summary: View Complaint Details (Admin)
      description: |
        Retrieve complaint for admin review and action
        
        **Related User Stories**: TPS-79
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Complaint retrieved
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Administrator APIs]
      summary: Update Complaint Status/Priority (Admin)
      description: |
        Update complaint status and/or priority
        
        **Related User Stories**: TPS-81, TPS-82, TPS-83, TPS-84
        
        **Status Workflow Restrictions** (TPS-81/82/83/84):
        - `in_progress` → `resolved` (verify repair)
        - `resolved` → `closed` (final closure)
        - `pending|assigned|in_progress` → `rejected` (not fixable)
        - Other transitions are blocked (400 error)
        
        **Notifications Fired**:
        - Status change → citizen notification
        - Reject with active assignment → worker also notified
        - Close/reject → citizen + assigned worker notified
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: ["in_progress", "resolved", "closed", "rejected"] }
                priority: { type: string, enum: ["low", "medium", "high", "urgent"] }
      responses:
        "200":
          description: Complaint updated
        "400":
          description: Invalid status transition or priority
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /admin/complaints/{id}/duplicates:
    get:
      tags: [Administrator APIs]
      summary: Get Duplicate Candidates
      description: |
        List still-open complaints near this one (within the configured
        `duplicate_detection_radius_meters`) that might report the same
        physical issue, nearest first, for the administrator to review
        before assigning a field worker.

        **Related User Stories**: None (added beyond baseline) — recovered
        from an earlier feature branch and reintegrated into this branch
        this sprint; no corresponding Jira TPS story.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: radius_meters
          in: query
          schema: { type: integer }
          description: Overrides the configured system-wide radius for this lookup only
      responses:
        "200":
          description: Duplicate candidates retrieved
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFoundError'

  /admin/complaints/{id}/mark-duplicate:
    post:
      tags: [Administrator APIs]
      summary: Mark Complaint as Duplicate
      description: |
        Link a complaint as a duplicate of an existing, still-open report.
        Reuses the existing `rejected` status transition (no new status is
        introduced) and notifies the citizen with duplicate-specific wording.

        **Related User Stories**: None (added beyond baseline) — recovered
        from an earlier feature branch and reintegrated into this branch
        this sprint; no corresponding Jira TPS story.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicate_of_id]
              properties:
                duplicate_of_id: { type: integer, example: 12 }
                reason: { type: string, example: "Same pothole reported on the map." }
      responses:
        "200":
          description: Complaint linked as a duplicate
        "400":
          description: Business rule violation (e.g. complaint already terminal, or primary complaint is itself a duplicate)
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFoundError'
        "422":
          $ref: '#/components/responses/ValidationError'

  /admin/complaints/{id}/assign:
    post:
      tags: [Administrator APIs]
      summary: Assign Complaint to Field Worker
      description: |
        Assign a pending/assigned complaint to a field worker
        
        **Related User Stories**: TPS-80
        
        **Validation**:
        - Complaint must be in "pending" or "assigned" status
        - Worker must be in the SAME city as the complaint
        - Complaint status automatically moves to "assigned"
        
        **Notification**: Worker and citizen both notified
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: integer }
                notes: { type: string, nullable: true }
                expected_completion_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: Assignment created
        "400":
          description: Worker not in same city or invalid complaint status
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          description: Complaint or worker not found

