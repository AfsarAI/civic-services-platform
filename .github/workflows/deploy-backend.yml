name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Azure App Service (Oryx) also installs requirements.txt itself on
      # deploy, but installing here first fails the job fast on a broken
      # dependency instead of only finding out after deploying.
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Repo is private, so GitHub Pages isn't an option (free plan only
      # serves Pages for public repos) — the Flask app serves the built SPA
      # itself instead, same origin as the API, so no CORS is needed either.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "/api/v1"
        run: npm run build

      - name: Copy frontend build into backend package
        run: |
          rm -rf backend/static_frontend
          cp -r frontend/dist backend/static_frontend

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

  # After the first deploy (or after a migration change), run this manually:
  # `flask db upgrade` against DATABASE_URL from a machine allowed through the
  # Azure Postgres firewall (see deployment/README.md) — not automated here
  # because it would require opening the DB firewall to GitHub-hosted runners.
