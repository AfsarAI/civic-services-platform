          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: sort_by
          in: query
          schema: { type: string, enum: ["assigned_at", "priority"] }
        - name: sort_order
          in: query
          schema: { type: string, enum: ["asc", "desc"] }
      responses:
        "200":
          description: Assignments retrieved with pagination
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "400":
