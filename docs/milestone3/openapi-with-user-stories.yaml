## Summary of Related Jira Stories

| Story | Title | Endpoints |
|---|---|---|
| TPS-1 | User Registration | POST /auth/register |
| TPS-2 | User Login & Auth | POST /auth/login, /refresh, /logout, GET /auth/me |
| TPS-3, TPS-4 | Submit & List Complaints | POST/GET /citizen/complaints |
| TPS-5 | View Complaint Details | GET/PUT/DELETE /citizen/complaints/{id} |
| TPS-10 | Citizen Dashboard | GET /citizen/dashboard |
| TPS-27 | Manage Field Workers | POST/GET/PUT/DELETE /admin/field-workers |
| TPS-31 | Location Services | GET /locations/* |
| TPS-33 | Manage Users | GET/PUT /admin/users |
| TPS-35 | Admin Dashboard | GET /admin/dashboard |
| TPS-42 | List Assignments | GET /fieldworker/assignments |
| TPS-43 | Accept Assignment | POST /fieldworker/assignments/{id}/accept |
| TPS-44 | Update Progress | PUT /fieldworker/assignments/{id}/update |
| TPS-45 | Assignment Details | GET /fieldworker/assignments/{id} |
| TPS-47 | Field Worker Dashboard | GET /fieldworker/dashboard |
| TPS-50 | Complete Assignment | POST /fieldworker/assignments/{id}/complete |
| TPS-52 | Assign to Worker | POST /admin/complaints/{id}/assign |
| TPS-53 | Complaint Summary Report | GET /reports/complaints/summary |
| TPS-56, TPS-57 | Status/Category Reports | GET /reports/complaints/by-* |
| TPS-59 | Citizen Feedback | POST /citizen/complaints/{id}/feedback |
| TPS-60 | Notifications | GET /notifications |
| TPS-75 | Cancel Complaint | DELETE /citizen/complaints/{id} |
| TPS-80 | List Complaints (Admin) | GET /admin/complaints |
| TPS-81, TPS-82, TPS-83, TPS-84 | Admin Workflow | GET/PUT /admin/complaints/{id} |
| TPS-85, TPS-96 | City-Scoped Reports | GET /reports/* |
| TPS-86, TPS-90 | Field Worker Features | GET /fieldworker/assignments |
| TPS-91, TPS-92, TPS-93, TPS-94 | Notifications | GET /notifications |
| TPS-98 | Municipal Admin Mgmt | POST /admin/municipal-administrators |
| TPS-99 | System Settings | GET/PUT /admin/settings |

