      summary: List Users
      description: |
        List platform users.

        **Related User Stories**: TPS-33

        **What's new in Milestone 4**: this endpoint (and `GET`/`PUT`
        `/admin/users/{id}`) is no longer system-admin-only. Municipal
        administrators may now call it too, but the `role` filter is forced
        server-side to `citizen` and results are scoped to their own
