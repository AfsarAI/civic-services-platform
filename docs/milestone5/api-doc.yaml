                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                is_active: { type: boolean }
                password: { type: string, format: password, description: "Optional new password. Requires confirm_password to match." }
                confirm_password: { type: string, format: password }
      responses:
        "200":
          description: User updated
        "400":
          description: Cannot deactivate own account
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'
        "404":
          $ref: '#/components/responses/NotFoundError'
        "409":
          description: An account with this email already exists
        "422":
          description: Password too weak, or confirm_password does not match password

  /admin/dashboard:
    get:
      tags: [Administrator APIs]
      summary: Admin Dashboard
      description: |
        Administrator dashboard: complaint totals/status breakdown, a status
        distribution chart, and 9 performance KPIs.

        **Related User Stories**: TPS-95, TPS-97

        **KPI fields returned**: `total_complaints`, `open_complaints`,
        `closed_complaints`, `by_status`, `avg_resolution_time_hours`,
        `avg_assignment_time_hours`, `complaint_closure_rate_percentage`,
        `field_worker_completion_rate_percentage`, `citizen_satisfaction_rating`,
        `high_priority_pending_count`, `active_field_workers`
        (plus legacy aliases `avg_resolution_hours`, `high_priority_complaints`)

        **City Scoping**: Municipal admins see only their own city; system
        admins are unscoped

        **Optional Filters**: `date_from`, `date_to` (YYYY-MM-DD)
      security:
        - Bearer: []
      parameters:
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Dashboard stats and KPIs retrieved
        "400":
          description: Invalid date_from/date_to format
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

