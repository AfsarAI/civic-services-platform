      security:
        - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maintenance_mode: { type: boolean }
                notify_on_status_change: { type: boolean }
                default_complaint_priority: { type: string, enum: ["low", "medium", "high", "urgent"] }
                duplicate_detection_radius_meters: { type: integer, minimum: 10, maximum: 2000, example: 50 }
      responses:
        "200":
          description: Settings updated
        "400":
